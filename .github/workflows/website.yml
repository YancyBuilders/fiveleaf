# Deploys website/public to this fork's configured Cloudflare Pages project.
# Needs CLOUDFLARE_PAGES_PROJECT and CLOUDFLARE_ACCOUNT_ID variables and a
# CLOUDFLARE_API_TOKEN secret with Cloudflare Pages: Edit.
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: >-
          npx --yes wrangler@4 pages deploy website/public
          --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
